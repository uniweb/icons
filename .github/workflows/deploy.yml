name: Deploy Icons to GitHub Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm is installed before setup-node on purpose. setup-node v5+ turns on
      # package-manager caching by itself when package.json carries a
      # `packageManager` field, and that caching needs pnpm already on PATH.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      # Node 24 is the ACTIVE LTS. Node 20 reached end-of-life 2026-04-30
      # (nodejs/Release schedule.json), so this was building the published
      # corpus on an unsupported runtime for ~4 months. `eb04c62` moved the
      # actions onto their Node 24 runtimes and deliberately left the build
      # here; this is the other half.
      #
      # ⚠️ This changes the `.tar.gz` bytes — a different zlib build deflates
      # identical input differently — so `archives[].sha256` moves on the next
      # publish while `contentSha256` does NOT. That is exactly the split
      # `scripts/lib/tar.js` documents, and a mirror keying its re-stock on
      # `contentSha256` should not re-download anything.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # `@uniweb/core` is declared `workspace:^` because this package is
      # developed inside a pnpm workspace, where that spec resolves to the
      # sibling checkout and is substituted with a real range at publish time.
      # CI clones this repo on its own, so there is no workspace to resolve
      # against and `pnpm install` fails with ERR_PNPM_WORKSPACE_PKG_NOT_FOUND.
      # The failure cannot be reproduced in a workspace checkout, where the
      # same install succeeds — so it only ever shows up here.
      #
      # Rewrite the spec to the published package, for CI only. `latest` is the
      # right target rather than a pinned range: build-cdn.js must write the
      # corpus with the same `iconPath` the published resolvers read it with.
      - name: Point workspace deps at their published versions
        run: npm pkg set 'dependencies.@uniweb/core=latest'

      # --no-frozen-lockfile: the step above intentionally edits package.json,
      # so a lockfile committed later would otherwise be treated as stale.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate SVG files for CDN
        run: node scripts/build-cdn.js

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./cdn

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
